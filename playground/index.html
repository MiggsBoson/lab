<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playground · The lab</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    /* Styles only this page needs. */
    .die { font-size: 3rem; line-height: 1; }
    .swatch {
      width: 3.5rem;
      height: 3.5rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--accent);
      transition: background 0.3s;
    }
  </style>
</head>
<body>
  <main>
    <p><a href="../">← The lab</a></p>
    <h1>Playground</h1>
    <p class="lede">Buttons to poke at.  Nothing here is saved or sent anywhere.</p>

    <section class="card">
      <h2>Counter</h2>
      <div class="row">
        <button id="minus" class="secondary" aria-label="Minus one">−</button>
        <span id="counter" class="big">0</span>
        <button id="plus" aria-label="Plus one">+</button>
        <button id="reset" class="secondary">Reset</button>
      </div>
    </section>

    <section class="card">
      <h2>Roll a die</h2>
      <div class="row">
        <button id="roll">Roll</button>
        <span id="die" class="die" aria-live="polite">⚀</span>
      </div>
    </section>

    <section class="card">
      <h2>Flip a coin</h2>
      <div class="row">
        <button id="flip">Flip</button>
        <strong id="coin" aria-live="polite"></strong>
      </div>
      <p id="tally" class="muted" style="margin-top: 0.75rem;">Heads 0 · Tails 0</p>
    </section>

    <section class="card">
      <h2>Random colour</h2>
      <div class="row">
        <button id="paint">New colour</button>
        <div id="swatch" class="swatch" aria-hidden="true"></div>
        <code id="hex"></code>
      </div>
    </section>
  </main>

  <script>
    // Find an element by its id="..." in the HTML above.
    const $ = (id) => document.getElementById(id);

    // A whole number from 0 up to (but not including) n.
    const randomInt = (n) => Math.floor(Math.random() * n);

    // ---- Counter: several buttons changing one number ------------------------

    let count = 0;
    const showCount = () => { $("counter").textContent = count; };

    $("plus").addEventListener("click", () => { count += 1; showCount(); });
    $("minus").addEventListener("click", () => { count -= 1; showCount(); });
    $("reset").addEventListener("click", () => { count = 0; showCount(); });

    // ---- Roll a die: flick through faces, then stop on one -------------------

    const faces = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];

    $("roll").addEventListener("click", () => {
      const button = $("roll");
      const die = $("die");
      button.disabled = true;
      die.setAttribute("aria-busy", "true");   // screen readers wait for the final face
      let flicks = 0;
      const timer = setInterval(() => {
        const n = randomInt(6);
        die.textContent = faces[n];
        die.setAttribute("aria-label", `You rolled ${n + 1}`);
        flicks += 1;
        if (flicks === 10) {
          clearInterval(timer);
          die.setAttribute("aria-busy", "false");
          button.disabled = false;
        }
      }, 60);
    });

    // ---- Flip a coin: a random choice plus a running tally -------------------

    let heads = 0;
    let tails = 0;

    $("flip").addEventListener("click", () => {
      if (Math.random() < 0.5) { heads += 1; $("coin").textContent = "Heads"; }
      else { tails += 1; $("coin").textContent = "Tails"; }
      $("tally").textContent = `Heads ${heads} · Tails ${tails}`;
    });

    // ---- Random colour: change a style from JavaScript -----------------------

    $("paint").addEventListener("click", () => {
      // A random number from 0 to 0xffffff, written as six hex digits.
      const hex = "#" + randomInt(0x1000000).toString(16).padStart(6, "0");
      $("swatch").style.background = hex;
      $("hex").textContent = hex;
    });
  </script>
  <script type="module" src="../together.js"></script>
</body>
</html>
