<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pass it on · The lab</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    /* Styles only this page needs. */
    .envelope {
      display: block;
      width: 100%;
      padding: 1.5rem 1rem;
      border: 1px dashed var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--fg);
      font-size: 1.05rem;
    }
    .envelope .big-emoji { display: block; font-size: 3rem; line-height: 1.2; }
    .envelope:hover { filter: none; border-color: var(--accent); }
    .paper {
      min-height: 6rem;
      padding: 1rem 1.2rem;
      border-radius: 4px;
      background: repeating-linear-gradient(transparent 0 1.6rem, rgb(80 120 200 / 0.18) 1.6rem calc(1.6rem + 1px)), #fffdf3;
      color: #222;
      font: 1.15rem / 1.6rem "Segoe Print", "Bradley Hand", "Comic Neue", cursive;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      box-shadow: 0 2px 8px rgb(0 0 0 / 0.15);
      rotate: -0.6deg;
    }
    .paper .caret { display: inline-block; width: 0.5ch; animation: blink 0.8s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    textarea {
      width: 100%;
      min-height: 7rem;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--fg);
      font: inherit;
      resize: vertical;
    }
    textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #notice:empty { display: none; }
  </style>
</head>
<body>
  <main>
    <p><a href="../">← The lab</a></p>
    <h1>Pass it on</h1>
    <p class="lede">The last person here left a note for whoever came next.  That's you.  Read it, then leave one for the next stranger.</p>

    <section class="card">
      <h2>For you</h2>
      <div id="received"><p class="muted">Checking the letterbox…</p></div>
    </section>

    <section class="card">
      <h2>For the next person</h2>
      <form id="leave">
        <textarea id="text" maxlength="280" placeholder="Something true, something kind, a tip, a riddle…" aria-label="Your note for the next visitor" required></textarea>
        <div class="row" style="margin-top: 0.6rem;">
          <button>Pass it on</button>
          <span id="count" class="muted">0 / 280</span>
        </div>
      </form>
      <p id="sent" class="muted" hidden></p>
      <p id="notice" class="muted" aria-live="polite" style="margin-top: 0.6rem;"></p>
    </section>
  </main>

  <script type="module">
    import { on, send } from "../together.js";

    const $ = (id) => document.getElementById(id);
    const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

    function timeAgo(ms) {
      const mins = Math.floor((Date.now() - ms) / 60000);
      if (mins < 1) return "just now";
      if (mins < 60) return `${mins} min ago`;
      if (mins < 48 * 60) return `${Math.floor(mins / 60)} hours ago`;
      return `${Math.floor(mins / 1440)} days ago`;
    }

    // Type the note out a letter at a time, as if it's being written in front of you.
    function typeOut(el, text) {
      el.textContent = "";
      const caret = document.createElement("span");
      caret.className = "caret";
      caret.textContent = "▍";
      const words = document.createTextNode("");
      el.append(words, caret);
      if (still) { words.data = text; caret.remove(); return; }
      const letters = Array.from(text);
      let i = 0;
      const next = () => {
        words.data += letters[i++] ?? "";
        if (i < letters.length) setTimeout(next, /[.,!?]/.test(letters[i - 1]) ? 220 : 28 + Math.random() * 40);
        else setTimeout(() => caret.remove(), 1500);
      };
      next();
    }

    on("note-for-you", (msg) => {
      const box = $("received");
      box.replaceChildren();
      if (!msg.note) {
        const p = document.createElement("p");
        p.textContent = "Nobody has left a note yet.  You're the first: whatever you write below will be the first thing the next person reads.";
        box.append(p);
        return;
      }
      const envelope = document.createElement("button");
      envelope.type = "button";
      envelope.className = "envelope";
      const icon = document.createElement("span");
      icon.className = "big-emoji";
      icon.textContent = "✉️";
      envelope.append(icon, `A note was left for you ${timeAgo(msg.note.at)}.  Tap to open it.`);
      envelope.addEventListener("click", () => {
        const paper = document.createElement("div");
        paper.className = "paper";
        const report = document.createElement("button");
        report.type = "button";
        report.className = "secondary";
        report.style.marginTop = "0.75rem";
        report.textContent = "Report this note";
        report.addEventListener("click", () => {
          if (!confirm("Report this note?  Two reports hide it.")) return;
          send({ type: "report-note", id: msg.note.id });
          report.textContent = "Reported";
          report.disabled = true;
        });
        const meta = document.createElement("p");
        meta.className = "muted";
        meta.textContent = `Left ${timeAgo(msg.note.at)} by someone you'll never know.  ${msg.passed} notes passed on so far.`;
        box.replaceChildren(paper, meta, report);
        typeOut(paper, msg.note.text);
      });
      box.append(envelope);
    });

    $("text").addEventListener("input", () => { $("count").textContent = `${$("text").value.length} / 280`; });

    $("leave").addEventListener("submit", (e) => {
      e.preventDefault();
      const text = $("text").value.trim();
      if (!text) return;
      if (!send({ type: "leave-note", text })) $("notice").textContent = "Not connected yet.  Try again in a moment.";
    });
    on("note-left", (msg) => {
      $("leave").hidden = true;
      $("sent").hidden = false;
      $("sent").textContent = `📮 Sent.  It's waiting for the next person who comes here.  ${msg.passed} notes passed on so far.`;
      $("notice").textContent = "";
    });
    on("notice", (msg) => { if (msg.about === "note") $("notice").textContent = msg.text; });
  </script>
</body>
</html>
